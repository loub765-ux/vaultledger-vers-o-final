  <script>
    tailwind.config = {
        darkMode: 'class',
        theme: {
            extend: {

                    card: "#ffffff",
                    border: "#ecece8",

                    "primary-hover": "#e1b900",
                    "text-main": "#111111",
                    "text-muted": "#8a8a8a",
                    'dark-background': '#1a1a1a',

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .sidebar-item {
      transition: .3s;
    }

    .sidebar {
      width: 290px;
      transition: width 0.25s ease, transform 0.3s ease;
    }

    .sidebar-collapsed {
      width: 92px !important;
    }

    .sidebar-collapsed .sidebar-item,
    .sidebar-collapsed #theme-toggle,
    .sidebar-collapsed #logoutBtn {
      justify-content: center;
      padding-left: 0.75rem !important;
      padding-right: 0.75rem !important;
    }

    .sidebar-collapsed .sidebar-item span,
    .sidebar-collapsed #theme-toggle span,
    .sidebar-collapsed #logoutBtn span,
    .sidebar-collapsed .sidebar-item > div > span {
      display: none !important;
    }

    .sidebar-active {
      --tw-shadow-color: rgba(225, 185, 0, 0.4);
      --tw-shadow: 0 10px 25px -5px var(--tw-shadow-color);
      box-shadow: var(--tw-shadow);
    }

    .card-shadow {
      --tw-shadow-color: rgba(0,0,0,.04);
      --tw-shadow: 0 20px 40px var(--tw-shadow-color);
      box-shadow: var(--tw-shadow);
    }
    .dark .card-shadow {
      --tw-shadow-color: rgba(0,0,0,.2);
    }

    .py-8 {
      overflow-y: scroll;
      overflow-x: hidden;
    }
    h1 { text-align: center; color: #333; }

    .calendar-header {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      max-width: 100%;
      margin: 0 auto;
      padding: 10px;
      border-radius: 24px;
    }


    .day-header {
      text-align: center;
      font-weight: bold;
    }
    .day {
      height: 130px;
      padding: 6px;
      overflow-y: auto;
      font-size: 0.85em;
      border-radius: 6px;
    }
    .today-highlight {
      box-shadow: 0 0 20px rgba(244, 196, 0, 0.4);
      position: relative;
      z-index: 10;
    }
    .day-name {
      font-weight: bold;
      margin-bottom: 6px;
      text-align: center;
    }
    .appointment {
      padding: 5px 7px;
      margin: 4px 0;
      border-radius: 5px;
      color: white;
      font-size: 0.8em;
      cursor: pointer;
    }
    .variavel { background: #22c55e; }
    .fixo { background: #3b82f6; }

    .form-container {
      max-width: 600px;
      padding: 20px;
      border-radius: 24px;
    }
    .form-container input, .form-container textarea, .form-container select, .form-container button {
      padding: 10px;
      margin: 8px 0;
      width: 100%;
      border-radius: 12px;
      border: 1px solid #ecece8;
      outline: none;
    }
    #addBtn {
      background: #f4c400;
      color: black;
      font-weight: 800;
      cursor: pointer;
      font-size: 1.1em;
      border: none;
      transition: 0.3s;
    }
    #addBtn:hover { background: #e1b900; }

    .list {
      max-width: 1000px;
      margin: 30px auto;
    }
    .appointment-item {
      padding: 15px;
      margin: 10px 0;
      background: white;
      border-radius: 16px;
      border-left: 6px solid;
      display: flex;
      justify-content: space-between;
    }

    /* Scrollbar da Sidebar */
    aside {
      scrollbar-width: thin;
      scrollbar-color: #d1d1d1 #f2f2f0; /* thumb track */
    }
    .dark aside {
      scrollbar-color: #3a3a3a #242424;
    }
    aside::-webkit-scrollbar {
      width: 6px;
    }
    aside::-webkit-scrollbar-track {
      background: #f2f2f0;
    }
    .dark aside::-webkit-scrollbar-track {
      background: #242424;
    }
    aside::-webkit-scrollbar-thumb {
      background-color: #d1d1d1;
      border-radius: 10px;
    }
    .dark aside::-webkit-scrollbar-thumb {
      background-color: #3a3a3a;
    }
  

  



/* === SIDEBAR ESTÁVEL - sem colapso === */
.sidebar {
  width: 290px !important;
  min-width: 290px !important;
}
.sidebar-collapsed {
  width: 290px !important; /* ignora colapso */
}
#main-content {
  margin-left: 290px !important;
}
.sidebar-collapsed .sidebar-item span,
.sidebar-collapsed #theme-toggle span,
.sidebar-collapsed #logoutBtn span,
.sidebar-collapsed .sidebar-item > div > span {
  display: inline !important; /* nunca esconde textos */
}
.sidebar-collapsed .sidebar-item,
.sidebar-collapsed #theme-toggle,
.sidebar-collapsed #logoutBtn {
  justify-content: flex-start !important;
  padding-left: 1rem !important;
  padding-right: 1rem !important;
}


/* === Notification Bell === */
.vl-notif-wrap { position: relative; }
.vl-notif-btn {
  width: 48px; height: 48px; border-radius: 16px;
  border: 1px solid #ecece8; background: #fff;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all .2s; position: relative;
}
.dark .vl-notif-btn { background: #242424; border-color: #3a3a3a; color: #f5f5f5; }
.vl-notif-btn:hover { background: #fafafa; transform: scale(1.05); }
.dark .vl-notif-btn:hover { background: #2a2a2a; }
.vl-notif-badge {
  position: absolute; top: -4px; right: -4px;

<script>
(function(){
  try {
    var s = JSON.parse(localStorage.getItem('vaultledger_settings') || '{}');
    var FONT_MAP = {
      roboto: "'Roboto', 'Plus Jakarta Sans', sans-serif",
      indie: "'Indie Flower', cursive",
      federo: "'Federo', sans-serif",
      ibm: "'IBM Plex Serif', serif"
    };
    var bg = s.background || 'white';
    var font = s.font || 'roboto';
    document.documentElement.style.setProperty('--vl-font', FONT_MAP[font] || FONT_MAP.roboto);
    document.documentElement.classList.remove('dark', 'theme-blue');
    function applyBody() {
      if (!document.body) return;
      document.body.style.fontFamily = FONT_MAP[font] || FONT_MAP.roboto;
      if (bg === 'black') {
        document.documentElement.classList.add('dark');
        document.body.style.background = '#0a0a0a';
        document.body.style.color = '#f5f5f5';
      } else if (bg === 'blue') {
        document.documentElement.classList.add('theme-blue');
        document.body.style.background = '#00152C';
        document.body.style.color = '#E8F1FF';
      } else {
        document.body.style.background = '';
        document.body.style.color = '';
      }
    }
    if (document.body) applyBody();
    else document.addEventListener('DOMContentLoaded', applyBody);
    window.VL_CURRENCY = s.currency || 'BRL';
    window.VL_formatMoney = function(v, full) {
      var cur = window.VL_CURRENCY || 'BRL';
      var locale = cur === 'BRL' ? 'pt-BR' : cur === 'EUR' ? 'de-DE' : cur === 'GBP' ? 'en-GB' : cur === 'JPY' ? 'ja-JP' : 'en-US';
      return Number(v||0).toLocaleString(locale, {
        style: 'currency', currency: cur,
        minimumFractionDigits: full ? 2 : 0,
        maximumFractionDigits: full ? 2 : 0
      });
    };
  } catch(e) {}
})();
</script>

      const primeiroDia = new Date(ano, mes, 1).getDay();

<script>
(function() {
  function pad(n){ return String(n).padStart(2,'0'); }
  function todayStr() {
    const d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
  }
  function tomorrowStr() {
    const d = new Date();
    d.setDate(d.getDate()+1);
    return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
  }
  function formatBR(iso) {
    if (!iso) return '';
    const p = iso.split('-');
    return p[2] + '/' + p[1] + '/' + p[0];
  }
  function formatMoney(v) {
    return Number(v||0).toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
  }
  function protocolBlocked() {
    return location.protocol === 'file:';
  }

  function getDueAgendamentos() {
    let list = [];
    // Prioriza dados do servidor (window.agendamentos)
    if (Array.isArray(window.agendamentos) && window.agendamentos.length) {
      list = window.agendamentos.slice();
    } else {
      try { list = JSON.parse(localStorage.getItem('agendamentos')) || []; } catch(e) {}
    }
    const t = todayStr();
    const tm = tomorrowStr();
    function normDate(d) {
      if (!d) return '';
      d = String(d).trim();
      // já ISO yyyy-mm-dd
      if (/^\d{4}-\d{2}-\d{2}/.test(d)) return d.slice(0, 10);
      // dd/mm/yyyy
      var m = d.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
      if (m) return m[3] + '-' + pad(m[2]) + '-' + pad(m[1]);
      return d.slice(0, 10);
    }
    return list
      .map(function(a) {
        return Object.assign({}, a, { data: normDate(a.data || a.date || '') });
      })
      .filter(function(a) { return a && (a.data === t || a.data === tm); })
      .map(function(a) {
        return Object.assign({}, a, {
          when: a.data === t ? 'today' : 'tomorrow'
        });
      });
  }

  function renderNotifUI() { window.renderNotifUI = renderNotifUI;
    const items = getDueAgendamentos();
    const badge = document.getElementById('vlNotifBadge');
    const list = document.getElementById('vlNotifList');
    if (!badge || !list) return;

    if (items.length === 0) {
      badge.classList.remove('show');
      badge.textContent = '0';
      list.innerHTML = '<div class="vl-notif-empty">Nenhum agendamento para hoje ou amanhã.</div>';
    } else {
      badge.classList.add('show');
      badge.textContent = String(items.length);
      list.innerHTML = items.map(a => {
        const nome = String(a.nome || 'Agendamento').replace(/</g,'&lt;');
        const desc = a.descricao ? '<p class="text-xs text-text-muted mt-1 truncate">' + String(a.descricao).replace(/</g,'&lt;') + '</p>' : '';
        return '<div class="vl-notif-item">' +
          '<div class="vl-notif-dot ' + a.when + '"></div>' +
          '<div class="min-w-0 flex-1">' +
            '<p class="font-bold text-sm text-text-main dark:text-dark-text-main truncate">' + nome + '</p>' +
            '<p class="text-xs text-text-muted mt-0.5">' + a.label + ' · ' + formatBR(a.data) + ' · ' + formatMoney(a.valor) + '</p>' +
            desc +
          '</div>' +
          '<span class="text-[10px] font-black uppercase tracking-wider ' + (a.when==='today'?'text-red-500':'text-yellow-600') + '">' + a.label + '</span>' +
        '</div>';
      }).join('');
    }
  }

  function showToast(msg, isError) {
    let t = document.getElementById('vlNotifToast');
    if (!t) {
      t = document.createElement('div');
      t.id = 'vlNotifToast';
      t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9999;padding:14px 22px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.2);max-width:90vw;text-align:center;transition:opacity .3s;pointer-events:none;';
      document.body.appendChild(t);
    }
    t.style.background = isError ? '#991b1b' : '#111827';
    t.style.color = '#fff';
    t.textContent = msg;
    t.style.opacity = '1';
    clearTimeout(t._timer);
    t._timer = setTimeout(function(){ t.style.opacity = '0'; }, 4500);
  }

  function fireNotification(title, body, tag) {
    try {
      const n = new Notification(title, {
        body: body,
        tag: tag || ('vl-' + Date.now()),
        icon: 'vaultledger_logo.png',
        badge: 'vaultledger_logo.png',
        requireInteraction: false
      });
      n.onclick = function() {
        window.focus();
        n.close();
        try { location.href = 'agenda.html'; } catch(e) {}
      };
      return true;
    } catch (err) {
      console.error('Notification error:', err);
      return false;
    }
  }

  function sendDueNotifications(silent) {
    if (protocolBlocked()) {
      if (!silent) showToast('Abra o site via localhost (Live Server) para notificações no PC.', true);
      return 0;
    }
    if (!('Notification' in window) || Notification.permission !== 'granted') return 0;

    const items = getDueAgendamentos();
    if (!items.length) return 0;

    // Evita spam: só uma vez por dia por agendamento
    const dayKey = 'vl_auto_notif_' + todayStr();
    let sentMap = {};
    try { sentMap = JSON.parse(localStorage.getItem(dayKey) || '{}'); } catch(e) {}

    let ok = 0;
    items.forEach(function(a) {
      const id = String(a.id);
      if (sentMap[id]) return;
      const title = (a.when === 'today' ? 'Agendamento HOJE: ' : 'Agendamento AMANHÃ: ') + (a.nome || 'Pagamento');
      const body = formatBR(a.data) + ' · ' + formatMoney(a.valor) + (a.descricao ? '\n' + a.descricao : '');
      if (fireNotification(title, body, 'vl-agenda-' + id)) {
        sentMap[id] = 1;
        ok++;
      }
    });

    try { localStorage.setItem(dayKey, JSON.stringify(sentMap)); } catch(e) {}
    return ok;
  }

  async function ensurePermissionAndNotify() {
    if (protocolBlocked()) {
      // Só avisa uma vez por sessão
      if (!sessionStorage.getItem('vl_file_warn')) {
        sessionStorage.setItem('vl_file_warn', '1');
        // não spammar toast em file://
      }
      renderNotifUI();
      return;
    }

    if (!('Notification' in window)) {
      renderNotifUI();
      return;
    }

    let permission = Notification.permission;

    // Primeira visita: pedir permissão automaticamente
    if (permission === 'default') {
      try {
        permission = await Notification.requestPermission();
      } catch (e) {
        console.warn('requestPermission failed', e);
      }
    }

    if (permission === 'granted') {
      const n = sendDueNotifications(true);
      if (n > 0 && !sessionStorage.getItem('vl_toast_sent_' + todayStr())) {
        sessionStorage.setItem('vl_toast_sent_' + todayStr(), '1');
        showToast(n + ' agendamento(s) notificado(s) no sistema.');
      }
    }

    renderNotifUI();
  }

  // Botão manual ainda funciona (reenvia / força)
  async function sendSystemNotificationsManual() {
    if (protocolBlocked()) {
      showToast('Notificações do PC não funcionam em file://. Use Live Server (localhost).', true);
      return;
    }
    if (!('Notification' in window)) {
      showToast('Navegador sem suporte a notificações.', true);
      return;
    }

    let permission = Notification.permission;
    if (permission === 'default') {
      try { permission = await Notification.requestPermission(); } catch(e) {}
    }
    if (permission !== 'granted') {
      showToast('Permissão negada. Ative no cadeado da barra de endereço.', true);
      return;
    }

    // Limpa mapa do dia para permitir reenvio manual
    try { localStorage.removeItem('vl_auto_notif_' + todayStr()); } catch(e) {}
    const n = sendDueNotifications(false);
    if (n > 0) showToast(n + ' notificação(ões) enviada(s).');
    else {
      const items = getDueAgendamentos();
      if (!items.length) showToast('Nenhum agendamento para hoje ou amanhã.');
      else showToast('Notificações já tinham sido enviadas hoje. Reenviado se necessário.');
      // force fire anyway on manual
      items.forEach(function(a) {
        const title = (a.when === 'today' ? 'Agendamento HOJE: ' : 'Agendamento AMANHÃ: ') + (a.nome || 'Pagamento');
        const body = formatBR(a.data) + ' · ' + formatMoney(a.valor);
        fireNotification(title, body, 'vl-agenda-manual-' + a.id + '-' + Date.now());
      });
      if (items.length) showToast(items.length + ' notificação(ões) reenviada(s).');
    }
  }

  function initBell() {
    window.renderNotifUI = renderNotifUI;
    window.ensurePermissionAndNotify = ensurePermissionAndNotify;
    window.getDueAgendamentos = getDueAgendamentos;

    const btn = document.getElementById('vlNotifBtn');
    const panel = document.getElementById('vlNotifPanel');
if (!btn || !panel) return;

    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      panel.classList.toggle('open');
      renderNotifUI();
      if (window.lucide) try { lucide.createIcons(); } catch(e) {}
    });
    document.addEventListener('click', function(e) {
      if (!panel.contains(e.target) && e.target !== btn && !btn.contains(e.target)) {
        panel.classList.remove('open');
      }
    });

    renderNotifUI();

    // Pedir permissão + notificar automaticamente ao entrar
    setTimeout(function() {
      ensurePermissionAndNotify();
    }, 600);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initBell);
  } else {
    initBell();
  }
})();
</script>

<script type="module">
import * as VL from './js/auth.js';
window.VL = VL;

(async function () {
  try {
    const user = await VL.requireAuth();
    if (!user) return;
    const greet = document.getElementById('userGreeting');
    if (greet && user.name) greet.textContent = 'Olá, ' + user.name.split(' ')[0] + ' 👋';
    document.getElementById('logoutBtn')?.addEventListener('click', (e) => {
      e.preventDefault();
      if (confirm('Deseja sair?')) VL.logout();
    });

    async function reloadAgenda() {
      const list = await VL.getAgenda();
      window.agendamentos = list.map(a => ({
        id: a.id,
        nome: a.nome,
        valor: a.valor,
        data: a.data,
        tipo: a.tipo,
        descricao: a.descricao || ''
      }));
      try { localStorage.setItem('agendamentos', JSON.stringify(window.agendamentos)); } catch(e) {}
      if (typeof renderizarTudo === 'function') renderizarTudo();
      if (typeof renderNotifUI === 'function') renderNotifUI();
      if (typeof ensurePermissionAndNotify === 'function') {
        try { await ensurePermissionAndNotify(); } catch(e) {}
      }
      if (window.lucide) lucide.createIcons();
    }

    window.__addAgenda = async function () {
      const nome = document.getElementById('nome').value.trim();
      const valor = parseFloat(document.getElementById('valor').value);
      const data = document.getElementById('data').value;
      const tipo = document.getElementById('tipo').value;
      const descricao = document.getElementById('descricao').value;
      if (!nome || isNaN(valor) || !data) {
        alert('Preencha nome, valor e data!');
        return;
      }
      try {
        await VL.createAgendaItem({ nome, valor, data, tipo, descricao });
        document.getElementById('nome').value = '';
        document.getElementById('valor').value = '';
        document.getElementById('data').value = '';
        document.getElementById('descricao').value = '';
        await reloadAgenda();
      } catch (err) {
        alert(err.message || 'Erro ao criar agendamento');
      }
    };
    window.adicionarAgendamento = window.__addAgenda;

    window.__removeAgenda = async function (id) {
      if (!confirm('Excluir este agendamento?')) return;
      try {
        await VL.deleteAgendaItem(id);
        await reloadAgenda();
      } catch (err) {
        alert(err.message || 'Erro');
      }
    };
    window.removerAgendamento = window.__removeAgenda;

    await reloadAgenda();
  } catch (err) {
    console.error(err);
    alert('Erro de autenticação/API: ' + (err.message || err));
  }
})();
</script>

      else openMenu();
    }

    btn.addEventListener('click', toggle);
    overlay.addEventListener('click', closeMenu);
    sidebar.querySelectorAll('a').forEach(function(a){
      a.addEventListener('click', function(){ closeMenu(); });
    });
    window.addEventListener('resize', function(){
      if (window.innerWidth > 900) closeMenu();
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initMobileNav);
  else initMobileNav();
})();
</script>

</body>
</html>
